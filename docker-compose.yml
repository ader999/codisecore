services:
  web:
    build: .
    container_name: codisecore-web
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL}
      DATA_UPLOAD_MAX_MEMORY_SIZE: ${DATA_UPLOAD_MAX_MEMORY_SIZE:-52428800}
      FILE_UPLOAD_MAX_MEMORY_SIZE: ${FILE_UPLOAD_MAX_MEMORY_SIZE:-26214400}
      DATA_UPLOAD_MAX_NUMBER_FIELDS: ${DATA_UPLOAD_MAX_NUMBER_FIELDS:-2000}
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    networks:
      - codisecore-net

  nginx:
    image: nginx:alpine
    container_name: codisecore-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - mediafiles:/app/media:ro
    depends_on:
      - web
    networks:
      - codisecore-net

volumes:
  staticfiles:
  mediafiles:

networks:
  codisecore-net:
    driver: bridge

