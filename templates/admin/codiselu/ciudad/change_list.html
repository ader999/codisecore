{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
  <li>
    <a href="{% url 'admin:codiselu_ciudad_exportar_miskito' %}?solo_pendientes=1&orientacion=horizontal"
       style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff !important; font-weight: 700; border-radius: 6px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; box-shadow: 0 2px 4px rgba(16, 185, 129, 0.4); border: none;"
       title="Exportar PDF en formato horizontal (apaisado) con columna de traducción al Miskito ampliada para facilitar la escritura manual del traductor">
      <span style="font-size: 14px;">📐</span>
      <span>PDF Miskito Horizontal (Traductores)</span>
    </a>
  </li>
  <li>
    <a href="{% url 'admin:codiselu_ciudad_exportar_miskito_excel' %}?solo_pendientes=1"
       style="background: linear-gradient(135deg, #107c41 0%, #0d5e31 100%); color: #ffffff !important; font-weight: 700; border-radius: 6px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; box-shadow: 0 2px 4px rgba(16, 124, 65, 0.4); border: none;"
       title="Exportar plantilla en Excel (.xlsx) conteniendo únicamente los textos pendientes de traducción al Miskito">
      <span style="font-size: 14px;">📊</span>
      <span>Excel Miskito (Solo Pendientes)</span>
    </a>
  </li>
  <li>
    <a href="{% url 'admin:codiselu_ciudad_exportar_miskito' %}?solo_pendientes=0"
       style="background: #1e3a8a; color: #ffffff !important; font-weight: 600; border-radius: 6px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;"
       title="Exportar PDF con todos los elementos y campos">
      <span style="font-size: 13px;">📚</span>
      <span>PDF Completo</span>
    </a>
  </li>
  {{ block.super }}
{% endblock %}
